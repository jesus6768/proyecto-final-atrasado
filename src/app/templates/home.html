<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Upload</title>
    <style>
        /* Light, modern theme with blue accent */
        :root{
            --bg: #f6f8fb;
            --card: #ffffff;
            --muted: #6b7280;
            --accent: #2563eb; /* blue-600 */
            --accent-strong: #1e40af; /* blue-800 */
            --success: #10b981;
            --shadow: 0 8px 24px rgba(37,99,235,0.08);
        }

        html,body{
            height:100%;
            margin:0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, var(--bg), #eef2ff 100%);
            color: #0f172a;
        }

        .page-wrap{
            min-height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
        }

        .form-container{
            background:var(--card);
            padding:28px;
            border-radius:12px;
            box-shadow:var(--shadow);
            width:100%;
            max-width:520px;
            border: 1px solid rgba(15,23,42,0.04);
        }

        h2{ 
            margin:0 0 8px 0;
            font-size:1.6rem;
            color: #0f172a;
            text-align:left;
        }

        p.lead{ 
            margin:0 0 18px 0;
            color:var(--muted);
            font-size:0.95rem;
        }

        label{
            display:block;
            margin:12px 0 6px 0;
            color:var(--muted);
            font-size:0.88rem;
        }

        input[type="file"]{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px dashed rgba(15,23,42,0.06);
            background:linear-gradient(90deg,#fff,#fbfdff);
            cursor:pointer;
        }

        select{
            width:100%;
            padding:10px 12px;
            border-radius:8px;
            border:1px solid rgba(15,23,42,0.06);
            background:var(--card);
            color:#0f172a;
        }

        .row{ display:flex; gap:12px; }

        button{
            display:inline-block;
            padding:12px 18px;
            border-radius:8px;
            border:none;
            background:var(--accent);
            color:white;
            font-weight:600;
            cursor:pointer;
            transition:transform .08s ease, background-color .12s ease;
        }

        button:hover{ background:var(--accent-strong); transform:translateY(-1px); }

        .note{
            font-size:0.85rem;
            color:var(--muted);
            margin-top:10px;
        }

        .popup{
            display:none;
            position:fixed;
            right:20px;
            top:20px;
            background:var(--success);
            color:white;
            padding:10px 16px;
            border-radius:8px;
            box-shadow:0 6px 18px rgba(16,185,129,0.18);
            z-index:1000;
        }

        @media(max-width:600px){
            .form-container{ padding:18px; }
            .row{ flex-direction:column; }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Binary File Upload</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <label for="file">Select File to Upload</label>
            <input type="file" id="file" name="file" required>

            <label for="environment">Target Environment</label>
            <select id="environment" name="environment">
                <option value="dev">Development</option>
                <option value="prod">Production</option>
            </select>

            <button type="submit">Upload File</button>
        </form>
    </div>

    <div id="popup" class="popup">✓ File Successfully Uploaded</div>

    <script>
        const form = document.getElementById('uploadForm');
        const popup = document.getElementById('popup');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    popup.textContent = "File Successfully Uploaded";
                    popup.style.display = 'block';
                    setTimeout(() => popup.style.display = 'none', 3000);
                } else {
                    alert("Upload failed.");
                }
            } catch (error) {
                console.error("Error uploading file:", error);
                alert("Error uploading file.");
            }
        });
    </script>
</body>
</html>
