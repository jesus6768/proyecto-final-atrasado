<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Upload & Sign</title>
    <style>
        :root{ --bg: #f6f8fb; --card: #ffffff; --muted: #6b7280; --accent: #2563eb; --accent-strong: #1e40af; --success: #10b981; --shadow: 0 8px 24px rgba(37,99,235,0.08); }
        html,body{ height:100%; margin:0; font-family: Inter, sans-serif; background: linear-gradient(180deg, var(--bg), #eef2ff 100%); color: #0f172a; }
        .page-wrap{ min-height:100%; display:flex; flex-direction: column; align-items:center; padding:40px 20px; gap: 20px; }
        .form-container{ background:var(--card); padding:28px; border-radius:12px; box-shadow:var(--shadow); width:100%; max-width:600px; margin-bottom: 20px; }
        h2{ margin:0 0 15px 0; color: #0f172a; }
        input[type="file"], select, button { width:100%; padding:12px; margin-top: 5px; border-radius:8px; border:1px solid #ddd; display: block; box-sizing: border-box; }
        button{ background:var(--accent); color:white; border:none; font-weight:600; cursor:pointer; margin-top: 20px; }
        button:hover{ background:var(--accent-strong); }
        .popup{ display:none; position:fixed; right:20px; top:20px; background:var(--success); color:white; padding:10px 16px; border-radius:8px; z-index:1000; }
        
        /* Estilos para la tabla */
        .table-container { background: white; padding: 20px; border-radius: 12px; box-shadow: var(--shadow); width: 100%; max-width: 900px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { color: var(--muted); font-weight: 600; }
        
        /* Estados */
        .status { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .status.signed { background: #dcfce7; color: #166534; } /* Verde */
        .status.pending { background: #fef9c3; color: #854d0e; } /* Amarillo */
        .status.uploaded { background: #e0f2fe; color: #0369a1; } /* Azul */
        
        .env-prod { color: #dc2626; font-weight: bold; }
        .env-dev { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="form-container">
            <h2>Binary File Upload</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <label for="file">Select File</label>
                <input type="file" id="file" name="file" required>
                
                <label for="environment" style="margin-top:15px;">Target Environment</label>
                <select id="environment" name="environment">
                    <option value="dev">Development (Auto-Sign)</option>
                    <option value="prod">Production (Requires Approval)</option>
                </select>

                <button type="submit">Upload & Process</button>
            </form>
        </div>

        <div class="table-container">
            <h3>History</h3>
            <table id="fileTable">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Env</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Signature (Hash)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td>{{ file.filename }}</td>
                        <td class="env-{{ file.environment }}">{{ file.environment }}</td>
                        <td><span class="status {{ file.status }}">{{ file.status }}</span></td>
                        <td>{{ file.uploaded_date }}</td>
                        <td title="{{ file.signature }}">{{ file.signature[:10] if file.signature else '-' }}...</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div id="popup" class="popup"></div>

    <script>
        const form = document.getElementById('uploadForm');
        const popup = document.getElementById('popup');
        const tableBody = document.querySelector('#fileTable tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            try {
                // 1. Subir Archivo
                const uploadRes = await fetch('/upload', { method: 'POST', body: formData });
                if (!uploadRes.ok) throw new Error("Upload failed");
                const fileData = await uploadRes.json();

                // 2. Intentar Firmar / Validar
                const signRes = await fetch('/sign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_id: fileData.id })
                });
                
                if (!signRes.ok) throw new Error("Sign request failed");
                const signData = await signRes.json();

                // 3. ACTUALIZACIÓN INMEDIATA DE LA TABLA (Sin recargar)
                // Combinamos los datos del upload con el estado final (pending o signed)
                const finalStatus = signData.status || fileData.status;
                const signaturePreview = signData.signature ? signData.signature.substring(0, 10) + '...' : '-...';
                const signatureFull = signData.signature || '';

                const newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td>${fileData.filename}</td>
                    <td class="env-${fileData.environment}">${fileData.environment}</td>
                    <td><span class="status ${finalStatus}">${finalStatus}</span></td>
                    <td>${fileData.uploaded_date}</td>
                    <td title="${signatureFull}">${signaturePreview}</td>
                `;

                // Insertamos la fila al principio de la tabla
                tableBody.insertBefore(newRow, tableBody.firstChild);

                // 4. Mostrar mensaje de éxito
                popup.textContent = finalStatus === 'signed' 
                    ? "File Signed Successfully!" 
                    : "File Uploaded! Check email for approval.";
                popup.style.display = 'block';
                setTimeout(() => popup.style.display = 'none', 4000);
                
                // Limpiar formulario
                form.reset();

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>
